name: Bug report
description: Something in the app is broken or behaving unexpectedly
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that take a fresh install (or a known state) to the bug.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How badly does this get in your way?
      options:
        - Blocks work completely
        - Major degradation
        - Minor bug
        - Cosmetic
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version / commit
      description: Report a Problem in Settings → About Hermex fills in the version and build. If you built from source, the commit.
    validations:
      required: true
  - type: input
    id: ios-version
    attributes:
      label: iOS version and device
      description: Report a Problem fills in the iOS version and iPhone or iPad; add the model if it matters.
      placeholder: e.g. iOS 18.5 on iPhone 15 Pro, or iOS 18 simulator
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Server kind and version
      description: Hermes or hermes-webui, and its release. Report a Problem fills this in when the app knows it; otherwise use the upstream tag/commit you deployed.
    validations:
      required: true
  - type: dropdown
    id: connection-path
    attributes:
      label: How the phone reaches the server
      options:
        - HTTPS tunnel (e.g. Cloudflare Tunnel)
        - Reverse proxy
        - Tailscale
        - Local network (LAN)
        - localhost (simulator only)
        - Other
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recordings
      description: Visual evidence helps a lot. Drag and drop to attach.
    validations:
      required: false
